name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-34"             "build-tools;34.0.0"             "cmake;3.22.1"             "ndk;25.2.9519653"

      - name: Bootstrap Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          rm -rf /tmp/gradle
          mkdir -p /tmp/gradle
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.2/bin/gradle --version
          /tmp/gradle/gradle-8.2/bin/gradle wrapper --gradle-version 8.2

      - name: Prepare build
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-whisper.sh
          mkdir -p app/src/main/assets

      - name: Fetch whisper.cpp
        run: ./tools/fetch-whisper.sh

      - name: Fetch bundled Whisper model
        run: |
          curl -L --fail --retry 3             "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin"             -o app/src/main/assets/ggml-tiny-q5_1.bin
          test -s app/src/main/assets/ggml-tiny-q5_1.bin

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Sign APK with Uber APK Signer debug key
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" \
            -o /tmp/uber-apk-signer.jar
          rm -rf signed-apk
          mkdir -p signed-apk
          java -jar /tmp/uber-apk-signer.jar \
            --apks app/build/outputs/apk/debug/app-debug.apk \
            --allowResign \
            --out signed-apk
          test -n "$(find signed-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Verify signed APK
        run: |
          java -jar /tmp/uber-apk-signer.jar \
            --apks signed-apk \
            --onlyVerify

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chords-app-debug-uber-signed
          path: signed-apk/*.apk
          if-no-files-found: error
